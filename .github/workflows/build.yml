name: Build Studio Apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Shell
        working-directory: shell
        run: pnpm build

      - name: Build DevTools
        working-directory: devtools
        run: pnpm build

      - name: Build Dev Runner
        working-directory: dev-runner
        run: pnpm build
