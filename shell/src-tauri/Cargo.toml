[package]
name = "hiapphub-shell"
version = "0.1.0"
edition = "2021"
description = "HiAppHub 极简 Shell — 4000+ 免费工具平台"

[lib]
name = "hiapphub_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
dirs = "6"
urlencoding = "2"
getrandom = "0.3"
flate2 = "1"
zstd = "0.13"
crc32fast = "1"
