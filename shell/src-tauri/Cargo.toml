[package]
name = "hiapphub-shell"
version = "0.1.0"
edition = "2021"
description = "HiAppHub 极简 Shell — 4000+ 免费工具平台"

[lib]
name = "hiapphub_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
dirs = "6"
urlencoding = "2"
flate2 = "1"
zstd = "0.13"
crc32fast = "1"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
hiapphub-host = { path = "../../hiapphub-host" }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
